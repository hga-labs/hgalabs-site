<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HGA Labs — Building the software of the future</title>
<meta name="description" content="HGA Labs builds the software of the future. Coming soon.">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#04030c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
.glow{position:fixed;inset:0;background:radial-gradient(60% 50% at 50% 45%,rgba(99,102,241,.28),transparent 70%),radial-gradient(40% 40% at 80% 80%,rgba(34,211,238,.15),transparent 70%);animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.grid{position:fixed;left:-50%;right:-50%;bottom:-10%;height:55%;background-image:linear-gradient(rgba(99,102,241,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.5) 1px,transparent 1px);background-size:60px 60px;transform:perspective(380px) rotateX(62deg);animation:move 2.4s linear infinite;mask-image:linear-gradient(transparent,#000 60%);-webkit-mask-image:linear-gradient(transparent,#000 60%)}
@keyframes move{to{background-position:0 60px}}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.pill{font-size:.8rem;letter-spacing:.35em;text-transform:uppercase;padding:.5rem 1.1rem;border:1px solid rgba(255,255,255,.3);border-radius:999px;backdrop-filter:blur(6px);margin-bottom:1.6rem;animation:fade 1.4s both}
h1{margin:0;font-size:clamp(3rem,13vw,9rem);font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(100deg,#fff 20%,#a5b4fc 40%,#22d3ee 60%,#fff 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite,rise 1.2s .2s both;position:relative}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.0;animation:glitch 6s infinite}
h1::before{transform:translate(3px,0);filter:drop-shadow(-2px 0 #f0abfc)}h1::after{transform:translate(-3px,0);filter:drop-shadow(2px 0 #22d3ee)}
@keyframes glitch{0%,92%,100%{opacity:0}93%,96%{opacity:.8;clip-path:inset(20% 0 55% 0)}94%{clip-path:inset(60% 0 10% 0)}95%{clip-path:inset(5% 0 80% 0)}}
@keyframes shine{to{background-position:-250% 0}}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.96);filter:blur(12px)}}
@keyframes fade{from{opacity:0}}
.tag{margin:1.4rem 0 0;font-size:clamp(1.05rem,2.6vw,1.6rem);color:#c7d2fe;min-height:2em;animation:fade 2s .6s both}
.tag span{border-right:2px solid #22d3ee;padding-right:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{border-color:transparent}}
.cta{margin-top:2.2rem;animation:fade 2s 1s both}
.cta a{color:#fff;text-decoration:none;padding:.85rem 1.6rem;border-radius:999px;background:linear-gradient(90deg,#6366f1,#22d3ee);box-shadow:0 0 30px rgba(99,102,241,.6);display:inline-block;transition:transform .2s,box-shadow .2s}
.cta a:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 0 50px rgba(34,211,238,.7)}
footer{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:.8rem;opacity:.5;z-index:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<canvas id="c"></canvas><div class="glow"></div><div class="grid"></div>
<main>
<div class="pill">Coming soon</div>
<h1 data-t="HGA Labs">HGA Labs</h1>
<p class="tag"><span id="t"></span></p>
<div class="cta"><a href="mailto:support@hgalabs.com">Get in touch</a></div>
</main>
<footer>&copy; 2026 HGA Labs LLC &middot; support@hgalabs.com</footer>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,P=[],m={x:-999,y:-999};
function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;const n=Math.min(130,Math.floor(innerWidth/9));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.6*devicePixelRatio,vy:(Math.random()-.5)*.6*devicePixelRatio}))}
addEventListener('resize',size);addEventListener('pointermove',e=>{m.x=e.clientX*devicePixelRatio;m.y=e.clientY*devicePixelRatio});size();
function tick(){x.clearRect(0,0,W,H);const d=130*devicePixelRatio;
for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
const dx=p.x-m.x,dy=p.y-m.y,md=Math.hypot(dx,dy);if(md<160*devicePixelRatio){p.x+=dx/md*1.5;p.y+=dy/md*1.5}
x.fillStyle='rgba(165,180,252,.9)';x.beginPath();x.arc(p.x,p.y,1.6*devicePixelRatio,0,7);x.fill()}
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],q=Math.hypot(a.x-b.x,a.y-b.y);if(q<d){x.strokeStyle='rgba(99,102,241,'+(1-q/d)*.5+')';x.lineWidth=devicePixelRatio;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
requestAnimationFrame(tick)}tick();
const lines=['Building the software of the future.','Apps that feel like tomorrow.','AI-first. Human-centered.','Something big is loading...'];let li=0,ci=0,del=false;const t=document.getElementById('t');
(function type(){const s=lines[li];t.textContent=s.slice(0,ci);if(!del&&ci<s.length){ci++;setTimeout(type,55)}else if(!del){del=true;setTimeout(type,1800)}else if(ci>0){ci--;setTimeout(type,25)}else{del=false;li=(li+1)%lines.length;setTimeout(type,300)}})();
</script></body></html>
